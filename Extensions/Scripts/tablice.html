	function start()
	{
		let s=prompt("podaj tekst do kodowania")
		const wynik=[]
		let max=0
		for (let a=0 ; a<s.length ; a++)
		{
			for (let b=0 ; b<tablice.length ; b++)
			{
				let pokrywa=1
				for (let c=0 ; c<tablice[b].tablica.length ; c++)
				{
					if ((s[a+c]||"!").toUpperCase()!=tablice[b].tablica[c].toUpperCase())
					{
						pokrywa=0
						break
					}
				}
				if (pokrywa)
				{
					wynik.push(tablice[b])
					max=a+(tablice[b].tablica.length-1)

				}
			}
			if (a>max)
			{
				wynik.push({tablica:s[a],powiat:""})
			}
		}
		s=""
		for (let a=0 ; a<wynik.length ; a++)
		{
			if (wynik[a].powiat)
			{
				s+=`${wynik[a].tablica} &nbsp; ${wynik[a].powiat}<br>`
			}
			else
			{
				s+=`<span style="color:red;">${wynik[a].tablica}</span><br>`
			}
		}
		const e=document.createElement("div")
		e.innerHTML=s
		document.body.appendChild(e)
	}
</script>
