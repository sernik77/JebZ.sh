<style>.loader,
.loader:before,
.loader:after {
  display: none;
  border-radius: 50%;
  width: 2.5em;
  height: 2.5em;
  -webkit-animation-fill-mode: both;
  animation-fill-mode: both;
  -webkit-animation: load7 1.8s infinite ease-in-out;
  animation: load7 1.8s infinite ease-in-out;
}

.loader {
  color: var(--blue-light);
  font-size: 10px;
  margin: 0 0 38px 15px;
  position: relative;
  text-indent: -9999em;
  -webkit-transform: translateY(-4px) translateZ(0) scale(0.5);
  -ms-transform: translateY(-4px) translateZ(0) scale(0.5);
  transform: translateY(-4px) translateZ(0) scale(0.5);
  -webkit-animation-delay: -0.16s;
  animation-delay: -0.16s;
}

.loader:before,
.loader:after {
  content: "";
  position: absolute;
  top: 0;
}

.loader:before {
  left: -3.5em;
  -webkit-animation-delay: -0.32s;
  animation-delay: -0.32s;
}

.loader:after {
  left: 3.5em;
}

@-webkit-keyframes load7 {
  0%,
  80%,
  100% {
    box-shadow: 0 2.5em 0 -1.3em;
  }

  40% {
    box-shadow: 0 2.5em 0 0;
  }
}

@keyframes load7 {
  0%,
  80%,
  100% {
    box-shadow: 0 2.5em 0 -1.3em;
  }

  40% {
    box-shadow: 0 2.5em 0 0;
  }
}

.loading + .loader,
.loading + .loader:before,
.loading + .loader:after {
  display: block;
}

.loading {
  display: none;
}
</style><style>a.darkmode {
  position: fixed;
  top: 2em;
  right: 2em;
  color: var(--text);
  background: var(--background);
  height: 3em;
  width: 3em;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  border: 2px solid var(--border);
  box-shadow: 0 0 3px rgb(0 0 0 / 12%), 0 1px 2px rgb(0 0 0 / 24%);
  transition: 0.2s ease-in box-shadow;
}

a.darkmode:hover {
  box-shadow: 0 0 6px rgb(0 0 0 / 16%), 0 3px 6px rgb(0 0 0 / 23%);
}

@media only screen and (max-width: 600px) {
  a.darkmode {
    top: unset;
    bottom: 1em;
    right: 1em;
  }
}

<option>true</option>
</select>
<label for="vCenter">Vertically Centered</label>
<select alt="Vertically Centered" class="param" id="vCenter" name="vCenter">
<option>false</option>
<option>true</option>
</select>
<label for="multiline">Multiline</label>

<option value="true">Each sentence on a new line</option>
</select>
<label for="repeat">Repeat</label>

<option>true</option>
<option>false</option>
</select>
<label for="random">Random</label>
<select alt="Random" class="param" id="random" name="random">
<option>false</option>
<option>true</option>
</select>
<label for="dimensions" title="Width ✕ Height">Width ✕ Height</label>

</span>
<input class="btn" onclick="preview.reset();" type="button" value="Reset"/>

</script><script>// enable dark mode on load if user prefers dark themes and has not used the toggle
getCookie("darkmode") === null && window.matchMedia("(prefers-color-scheme: dark)").matches && darkmode();

function toggleTheme() {
  // turn on dark mode
  if (document.body.getAttribute("data-theme") !== "dark") {
    darkmode();
  }
  // turn off dark mode
  else {
    lightmode();
  }
}

function darkmode() {
  document.querySelector(".darkmode i").className = "gg-sun";
  setCookie("darkmode", "on", 9999);
  document.body.setAttribute("data-theme", "dark");
}

function lightmode() {
  document.querySelector(".darkmode i").className = "gg-moon";
  setCookie("darkmode", "off", 9999);
  document.body.removeAttribute("data-theme");
}

function setCookie(cname, cvalue, exdays) {
  var d = new Date();
  d.setTime(d.getTime() + exdays * 24 * 60 * 60 * 1000);
  var expires = "expires=" + d.toUTCString();
  document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
}

function getCookie(name) {
  var dc = document.cookie;
  var prefix = name + "=";
  var begin = dc.indexOf("; " + prefix);
  if (begin == -1) {
    begin = dc.indexOf(prefix);
    if (begin != 0) return null;
  } else {
    begin += 2;
    var end = document.cookie.indexOf(";", begin);
    if (end == -1) {
      end = dc.length;
    }
  }
  return decodeURI(dc.substring(begin + prefix.length, end));
}

    input.type = "text";

    input.name = `line-${index}`;

    input.dataset.index = index;

  reset: function () {

      width: "435",

    // reset all inputs
    const inputs = document.querySelectorAll(".param");
    inputs.forEach((input) => {
      let value = overrides[input.name] || this.defaults[input.name];

          input.jscolor.fromString(value);
        } else {
          input.value = value;
        }
      }
    });
  },
};

let clipboard = {
  copy: function (el) {
    // create input box to copy from
    const input = document.createElement("input");
    input.value = el.parentElement.querySelector("code").innerText;
    document.body.appendChild(input);
    // select all
    input.select();
    input.setSelectionRange(0, 99999);
    // copy
    document.execCommand("copy");
    // remove input box
    input.parentElement.removeChild(input);
    // set tooltip text
    el.title = "Copied!";
  },
};

let tooltip = {
  reset: function (el) {
    // remove tooltip text
    el.removeAttribute("title");
  },
};

// refresh preview on interactions with the page
document.addEventListener("keyup", () => preview.update(), false);
document.addEventListener("click", () => preview.update(), false);

// checkbox listener
document.querySelector(".show-border input").addEventListener("change", function () {
  const img = document.querySelector(".output img");
  this.checked ? img.classList.add("outlined") : img.classList.remove("outlined");
});

// when the page loads
window.addEventListener(
  "load",
  () => {
    // add first line
    preview.addLine();
    preview.update();
  },
  false
);
